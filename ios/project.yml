name: SharedCalendar
options:
  bundleIdPrefix: cz.gabrhelovi
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: "0.1.0"
targets:
  SharedCalendar:
    type: application
    platform: iOS
    sources:
      - path: SharedCalendar
    info:
      path: SharedCalendar/Info.plist
      properties:
        UILaunchScreen: {}
    entitlements:
      path: SharedCalendar/SharedCalendar.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.gabrhelovi.sharedcalendar
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
