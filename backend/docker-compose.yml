services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - ADMIN_BOOTSTRAP_SECRET=${ADMIN_BOOTSTRAP_SECRET}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID}
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
